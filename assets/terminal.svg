<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="640" height="340" viewBox="0 0 640 340" role="img" aria-label="Terminal card">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <clipPath id="win"><rect width="640" height="340" rx="14"/></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; }
      .p  { fill: #22D3EE; } .cmd { fill: #F8FAFC; } .k { fill: #818CF8; } .v { fill: #CBD5E1; } .s { fill: #A3E635; } .c { fill: #64748B; } .ok { fill: #22C55E; }
      .line { opacity: 0; animation: show .01s linear forwards; }
      .cover { fill: #0B1220; animation: type .9s steps(28, end) forwards; }
      .cur { fill: #22D3EE; animation: blink 1s steps(2, start) infinite; }
      @keyframes show { to { opacity: 1 } }
      @keyframes type { to { transform: translateX(560px) } }
      @keyframes blink { to { visibility: hidden } }
    </style>
  </defs>
  <g clip-path="url(#win)">
    <rect width="640" height="340" fill="#0B1220"/>
    <rect width="640" height="38" fill="#0F172A"/>
    <circle cx="20" cy="19" r="6" fill="#EF4444"/><circle cx="40" cy="19" r="6" fill="#F59E0B"/><circle cx="60" cy="19" r="6" fill="#22C55E"/>
    <text class="mono c" x="320" y="24" text-anchor="middle" font-size="12">cornedru@kali: ~</text>
    <rect x="0" y="38" width="640" height="1" fill="#1E293B"/>

    <!-- line 1 -->
    <g class="line" style="animation-delay:.3s">
      <text class="mono" x="20" y="72"><tspan class="p">❯</tspan> <tspan class="cmd">cat ~/.profile</tspan></text>
      <rect class="cover" x="40" y="56" width="600" height="22" style="animation-delay:.3s"/>
    </g>
    <!-- output -->
    <g class="line" style="animation-delay:1.3s">
      <text class="mono" x="20" y="104"><tspan class="k">name</tspan><tspan class="v">      = </tspan><tspan class="s">"Cornedru"</tspan></text>
      <text class="mono" x="20" y="128"><tspan class="k">school</tspan><tspan class="v">    = </tspan><tspan class="s">"École 42"</tspan></text>
      <text class="mono" x="20" y="152"><tspan class="k">track</tspan><tspan class="v">     = </tspan><tspan class="s">"Cybersecurity · System dev"</tspan></text>
      <text class="mono" x="20" y="176"><tspan class="k">langs</tspan><tspan class="v">     = [</tspan><tspan class="s">"C"</tspan><tspan class="v">, </tspan><tspan class="s">"C++"</tspan><tspan class="v">, </tspan><tspan class="s">"Python"</tspan><tspan class="v">, </tspan><tspan class="s">"Bash"</tspan><tspan class="v">, </tspan><tspan class="s">"asm"</tspan><tspan class="v">]</tspan></text>
      <text class="mono" x="20" y="200"><tspan class="k">interests</tspan><tspan class="v"> = [</tspan><tspan class="s">"red team"</tspan><tspan class="v">, </tspan><tspan class="s">"pwn"</tspan><tspan class="v">, </tspan><tspan class="s">"reverse"</tspan><tspan class="v">, </tspan><tspan class="s">"osint"</tspan><tspan class="v">]</tspan></text>
      <text class="mono" x="20" y="224"><tspan class="k">status</tspan><tspan class="v">    = </tspan><tspan class="s">"open to security internships"</tspan></text>
    </g>
    <!-- line 2 -->
    <g class="line" style="animation-delay:2.1s">
      <text class="mono" x="20" y="262"><tspan class="p">❯</tspan> <tspan class="cmd">./break --then-fix</tspan></text>
      <rect class="cover" x="40" y="246" width="600" height="22" style="animation-delay:2.1s"/>
    </g>
    <g class="line" style="animation-delay:3.1s">
      <text class="mono" x="20" y="290"><tspan class="ok">✔</tspan> <tspan class="v">systems understood · tools shipped · defenses hardened</tspan></text>
      <text class="mono" x="20" y="320"><tspan class="p">❯</tspan> <tspan class="cur">▍</tspan></text>
    </g>
  </g>
  <rect x="0" y="336" width="640" height="4" fill="url(#accent)"/>
</svg>
