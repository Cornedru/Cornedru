<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Cornedru — Offensive security and low-level development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Menlo, Consolas, monospace; }
      .name { font-size: 86px; font-weight: 800; letter-spacing: -2px; fill: #F8FAFC; }
      .tag  { font-size: 20px; fill: #94A3B8; }
      .kw   { fill: #22D3EE; }
      .str  { fill: #A3E635; }
      .cm   { fill: #64748B; }
      .cursor { fill: #22D3EE; animation: blink 1s steps(2, start) infinite; }
      .fade { opacity: 0; animation: fade .9s ease-out forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .55s } .d3 { animation-delay: .95s } .d4 { animation-delay: 1.35s }
      .scan { animation: scan 7s linear infinite; }
      .orbit { transform-origin: 1040px 160px; animation: spin 24s linear infinite; }
      .orbit2 { transform-origin: 1040px 160px; animation: spin 38s linear infinite reverse; }
      @keyframes blink { to { visibility: hidden } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes scan { from { transform: translateY(-20px) } to { transform: translateY(340px) } }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>
    <rect class="scan" width="1200" height="2" fill="#22D3EE" opacity="0.18"/>

    <!-- orbit ornament -->
    <g opacity="0.9">
      <circle cx="1040" cy="160" r="96" fill="none" stroke="#1E293B" stroke-width="1"/>
      <circle cx="1040" cy="160" r="64" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6"/>
      <circle cx="1040" cy="160" r="28" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="1040" cy="160" r="6" fill="#22D3EE"/>
      <g class="orbit"><circle cx="1136" cy="160" r="5" fill="#F472B6"/></g>
      <g class="orbit2"><circle cx="1104" cy="160" r="4" fill="#818CF8"/></g>
      <circle cx="1040" cy="160" r="110" fill="url(#accent)" opacity="0.08" filter="url(#blur)"/>
    </g>

    <!-- content -->
    <g transform="translate(72 0)">
      <text class="mono tag fade d1" x="0" y="96"><tspan class="cm">// </tspan><tspan class="kw">whoami</tspan></text>
      <text class="mono name fade d2" x="-4" y="178">Cornedru<tspan class="cursor" dx="8">_</tspan></text>
      <text class="mono tag fade d3" x="0" y="224"><tspan class="kw">const</tspan> focus = [<tspan class="str">"offensive security"</tspan>, <tspan class="str">"low-level dev"</tspan>, <tspan class="str">"reverse engineering"</tspan>];</text>
      <text class="mono tag fade d4" x="0" y="256"><tspan class="cm">// École 42 · Red Team · CTF · C / Python / Bash</tspan></text>
    </g>

    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
