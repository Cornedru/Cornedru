<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="By the numbers">
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Menlo, Consolas, monospace; }
      .big { font-size: 40px; font-weight: 800; fill: #F8FAFC; }
      .lbl { font-size: 13px; fill: #94A3B8; letter-spacing: .5px; }
      .sub { font-size: 12px; fill: #64748B; }
      .tile { fill: #0B1220; stroke: #1E293B; }
      .bar { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; transform-origin: left; transform: scaleX(0); }
      .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
      .fade { opacity: 0; animation: fade .8s ease-out forwards; }
      .f2 { animation-delay: .15s } .f3 { animation-delay: .3s } .f4 { animation-delay: .45s }
      @keyframes grow { to { transform: scaleX(1) } }
      @keyframes fade { to { opacity: 1 } }
    </style>
  </defs>
  <g class="fade">
    <rect class="tile" x="0.5" y="0.5" width="291" height="149" rx="12"/>
    <text class="mono big" x="24" y="68">~30k</text>
    <text class="mono lbl" x="24" y="96">LINES OF RUST</text>
    <text class="mono sub" x="24" y="116">in a single async service workspace</text>
    <rect class="bar" x="24" y="130" width="243" height="3" rx="2" fill="url(#accent)"/>
  </g>
  <g class="fade f2">
    <rect class="tile" x="303.5" y="0.5" width="291" height="149" rx="12"/>
    <text class="mono big" x="327" y="68">15+</text>
    <text class="mono lbl" x="327" y="96">PROJECTS IN 2026</text>
    <text class="mono sub" x="327" y="116">reverse engineering, tooling, research</text>
    <rect class="bar b2" x="327" y="130" width="243" height="3" rx="2" fill="url(#accent)"/>
  </g>
  <g class="fade f3">
    <rect class="tile" x="606.5" y="0.5" width="291" height="149" rx="12"/>
    <text class="mono big" x="630" y="68">4</text>
    <text class="mono lbl" x="630" y="96">LANGUAGES IN PRODUCTION</text>
    <text class="mono sub" x="630" y="116">Rust · Go · C · Python</text>
    <rect class="bar b3" x="630" y="130" width="243" height="3" rx="2" fill="url(#accent)"/>
  </g>
  <g class="fade f4">
    <rect class="tile" x="908.5" y="0.5" width="291" height="149" rx="12"/>
    <text class="mono big" x="932" y="68">2024→</text>
    <text class="mono lbl" x="932" y="96">ÉCOLE 42</text>
    <text class="mono sub" x="932" y="116">from libc in C to bug bounty reports</text>
    <rect class="bar b4" x="932" y="130" width="243" height="3" rx="2" fill="url(#accent)"/>
  </g>
</svg>
